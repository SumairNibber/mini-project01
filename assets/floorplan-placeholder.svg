    <line x1="560" y1="550" x2="1080" y2="550" />
    <line x1="620" y1="120" x2="620" y2="380" />
  </g>
  <text x="600" y="390" text-anchor="middle" font-size="62" font-family="Arial, sans-serif" fill="#102a43" font-weight="700">
