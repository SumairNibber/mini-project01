  <desc id="desc">Placeholder blueprint image to be replaced with accurate floor plans.</desc>
  <rect width="1200" height="800" fill="#d9e2ec" />
  <g stroke="#486581" stroke-width="6" fill="none" opacity="0.85">
    <rect x="50" y="50" width="1100" height="700" />
    <rect x="120" y="120" width="300" height="200" />
    <rect x="450" y="120" width="280" height="260" />
    <rect x="760" y="120" width="320" height="200" />
    <rect x="120" y="360" width="400" height="320" />
